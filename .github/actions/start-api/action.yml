name: "Build & start API"
description: "Build jar, start API in background, wait for /health"
inputs:
  java-version:
    required: false
    default: "21"
    description: "Java-21"

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Build (Maven)
      shell: bash
      run: mvn -q clean package

    - name: Start API (background)
      shell: bash
      run: |
        nohup java -jar target/*.jar > app.log 2>&1 &
        echo $! > app.pid

    - name: Wait for API to be ready
      shell: bash
      run: |
        for i in {1..30}; do
          if curl -sSf http://localhost:8080/health > /dev/null; then
            echo "API is up!"
            exit 0
          fi
          echo "Waiting API..."
          sleep 2
        done
        echo "API not ready"
        tail -n 200 app.log || true
        exit 1