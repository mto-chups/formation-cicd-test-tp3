name: CI

on:
  push:

env:
  TODAY: ${{ github.run_started_at }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.date.outputs.today }}
      datetime: ${{ steps.date.outputs.datetime }}
    steps:
      - id: date
        run: |
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
  api-tests:
    runs-on: ubuntu-latest
    needs: prepare

    env:
      TODAY: ${{ needs.prepare.outputs.today }}
      NOW: ${{ needs.prepare.outputs.datetime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + start API
        uses: ./.github/actions/start-api

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ env.TODAY }}
          path: api-test-reports

      - name: Stop API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

      - name: Show app logs on failure
        if: failure()
        run: tail -n 200 app.log || true

  security-tests:
    runs-on: ubuntu-latest
    needs:
      - api-tests
      - prepare

    env:
      TODAY: ${{ needs.prepare.outputs.today }}
      NOW: ${{ needs.prepare.outputs.datetime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + start API
        uses: ./.github/actions/start-api

      - name: Set date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-reports-${{ env.TODAY }}