name: CI

on:
  push:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.date.outputs.today }}
      datetime: ${{ steps.date.outputs.datetime }}
    steps:
      - id: date
        run: |
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
  api-tests:
    runs-on: ubuntu-latest
    needs: prepare

    env:
      TODAY: ${{ needs.prepare.outputs.today }}
      NOW: ${{ needs.prepare.outputs.datetime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + start API
        uses: ./.github/actions/start-api

      - name: Prepare API test reports directory
        run: mkdir -p api-test-reports

      - name: Run API tests (Hurl via Docker)
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}:/work \
            ghcr.io/orange-opensource/hurl:latest \
            --test /work/src/test/java/api \
            --verbose \
            --report-junit /work/api-test-reports/junit.xml \
            --report-html /work/api-test-reports/report.html \
            --report-json /work/api-test-reports/report.json

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ env.TODAY }}
          path: api-test-reports

      - name: Stop API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

      - name: Show app logs on failure
        if: failure()
        run: tail -n 200 app.log || true

  security-tests:
    runs-on: ubuntu-latest
    needs:
      - prepare

    env:
      TODAY: ${{ needs.prepare.outputs.today }}
      NOW: ${{ needs.prepare.outputs.datetime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + start API
        uses: ./.github/actions/start-api

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-reports-${{ env.TODAY }}

      - name: Stop API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

      - name: Show app logs on failure
        if: failure()
        run: tail -n 200 app.log || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports-${{ env.NOW }}
          path: |
            report_html.html
            report_md.md